<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="No logo">
  <!--
    The stand-in when a COMPANY has uploaded no logo, so it should read as "a company".

    It was a cloud, which was wrong twice: a cloud is not what a company looks like, and on
    a site called SAP Hub a grey cloud in a logo slot reads as the one mark this
    site must not wear. See the note in logo-mark.svg.
  -->
  <rect width="128" height="128" rx="12" fill="#eef1f4"/>
  <g fill="#c9cfd6">
    <rect x="30" y="34" width="38" height="62" rx="3"/>
    <rect x="72" y="54" width="28" height="42" rx="3"/>
  </g>
  <g fill="#eef1f4">
    <rect x="38" y="43" width="8" height="8" rx="1.5"/><rect x="52" y="43" width="8" height="8" rx="1.5"/>
    <rect x="38" y="58" width="8" height="8" rx="1.5"/><rect x="52" y="58" width="8" height="8" rx="1.5"/>
    <rect x="38" y="73" width="8" height="8" rx="1.5"/><rect x="52" y="73" width="8" height="8" rx="1.5"/>
    <rect x="80" y="63" width="7" height="7" rx="1.5"/><rect x="80" y="76" width="7" height="7" rx="1.5"/>
  </g>
</svg>
