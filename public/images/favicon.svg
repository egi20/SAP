<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64" role="img" aria-label="SAP Hub">
  <!--
    The same mark on a filled tile. A browser tab renders this at 16px against an unknown
    background, so the detail is dropped and the contrast is carried by the tile rather
    than by the strokes: the six-node version turns to mush at that size.
  -->
  <rect width="64" height="64" rx="14" fill="#00265b"/>
  <g stroke="#7ac5ff" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="32" y1="32" x2="32" y2="17"/>
    <line x1="32" y1="32" x2="47" y2="41"/>
    <line x1="32" y1="32" x2="17" y2="41"/>
  </g>
  <g fill="#7ac5ff">
    <circle cx="32" cy="15" r="7"/>
    <circle cx="47" cy="43" r="7"/>
    <circle cx="17" cy="43" r="7"/>
  </g>
  <circle cx="32" cy="32" r="8" fill="#0070f2"/>
</svg>
